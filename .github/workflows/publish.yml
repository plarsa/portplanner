name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # A v-tag publishes a release of the tagged version. A push to main
      # publishes the snapshot version set in the pom.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: portplanner-backend
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="${GITHUB_REF_NAME#v}"
          -DgenerateBackupPoms=false

      - name: Build and publish
        working-directory: portplanner-backend
        run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
