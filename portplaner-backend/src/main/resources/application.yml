spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portplaner}
    username: ${DB_USER:portplaner}
    password: ${DB_PASSWORD:portplaner}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:portplaner-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

server:
  port: ${PORT:8080}

logging:
  level:
    se.portplaner: DEBUG
