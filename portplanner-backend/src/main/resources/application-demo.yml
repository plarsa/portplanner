# Demo and test profile: every module is enabled and admin has write access everywhere.
# Start with: --spring.profiles.active=demo (or SPRING_PROFILES_ACTIVE=demo).
# Never use in production: the account below has a publicly known password.
portplanner:
  iam:
    superadmins:
      - username: demo
        password: demo-password-2026
        enabled: true
  modules:
    base:
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
    storage:
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
    member-portal:
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
    audit:
      enabled: true
      access: [superadmin:rw, admin:rw]
    reports:
      enabled: true
      access: [superadmin:rw, admin:rw]
    ai-mail:
      enabled: true
      access: [superadmin:rw, admin:rw]
    import-export:
      enabled: true
      access: [superadmin:rw, admin:rw]
    rentals:
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
