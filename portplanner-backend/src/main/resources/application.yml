spring:
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/portplanner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 8h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

logging:
  level:
    se.portplanner: DEBUG

portplanner:
  modules:
    base:
      enabled: true            # måste vara true, appen vägrar starta annars
      access: { HARBOUR_MASTER: write, ADMIN: write, MEMBER: write }   # MEMBER: egna data
    storage:                   # Uppläggningsplatser
      enabled: true
      access: { HARBOUR_MASTER: write, ADMIN: write, MEMBER: write }
      default-season-start: 09-15
      max-boats-per-packing-group: 6
    member-portal:
      enabled: true
      access: { HARBOUR_MASTER: write, ADMIN: write, MEMBER: write }
    audit:
      enabled: true
      access: { HARBOUR_MASTER: read, ADMIN: read }
    reports:
      enabled: false
    ai-mail:
      enabled: false
    import-export:
      enabled: true
      access: { HARBOUR_MASTER: write, ADMIN: write }
