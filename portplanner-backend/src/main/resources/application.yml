spring:
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/portplanner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 8h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

logging:
  level:
    se.portplanner: DEBUG

portplanner:
  iam:
    # Systemets superadmin lever bara här, aldrig i databasen. Minst en aktiverad krävs för att appen ska starta.
    # password: bcrypt-hash (rekommenderas, {bcrypt}-prefix valfritt). Klartext accepteras men ger varning.
    superadmins:
      - username: ${SUPERADMIN_USERNAME:}
        password: ${SUPERADMIN_PASSWORD:}
        enabled: true
  modules:
    base:
      enabled: true            # måste vara true, appen vägrar starta annars
      access: [superadmin:rw, admin:rw, member:rw]   # member: egna data
    storage:                   # Uppläggningsplatser
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
      default-season-start: 09-15
      max-boats-per-packing-group: 6
    member-portal:
      enabled: true
      access: [superadmin:rw, admin:rw, member:rw]
    audit:
      enabled: true
      access: [superadmin:r, admin:r]
    reports:
      enabled: false
    ai-mail:
      enabled: false
    import-export:
      enabled: true
      access: [superadmin:rw, admin:rw]
