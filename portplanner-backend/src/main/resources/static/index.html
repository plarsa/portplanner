<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portplanner</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f7fb;
        color: #1a2535;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 2rem; font-weight: 700; margin: 0 0 0.5rem; }
      .tagline { color: #5a6b80; margin: 0 0 2.5rem; font-size: 0.95rem; }
      .choices { display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; }
      .choice {
        display: block;
        width: 220px;
        padding: 1.5rem;
        border-radius: 10px;
        background: #1a3a5c;
        color: white;
        text-decoration: none;
        text-align: center;
      }
      .choice:hover { background: #24507d; }
      .choice .label { display: block; font-size: 1.15rem; font-weight: 700; }
      .choice .hint { display: block; margin-top: 0.35rem; font-size: 0.85rem; color: rgba(255,255,255,0.75); }
      footer {
        padding: 0.6rem 1rem;
        text-align: center;
        font-size: 0.75rem;
        color: #7d8a9c;
        background: #e8eef6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>&#9875; Portplanner</h1>
      <p class="tagline">Hamnens platstilldelning, kö och vinterupptagning</p>
      <div class="choices">
        <a class="choice" href="/member/">
          <span class="label">User</span>
          <span class="hint">Medlemsportal</span>
        </a>
        <a class="choice" href="/admin/">
          <span class="label">Admin</span>
          <span class="hint">Hamnadministration</span>
        </a>
      </div>
    </main>
    <footer>Portplanner <span id="version"></span></footer>
    <script>
      fetch('/api/version')
        .then(r => r.json())
        .then(d => { document.getElementById('version').textContent = d.version })
        .catch(() => {})
    </script>
  </body>
</html>
