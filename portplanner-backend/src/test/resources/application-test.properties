spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
portplanner.iam.superadmins[0].username=admin
portplanner.iam.superadmins[0].password=admin123
portplanner.iam.superadmins[0].enabled=true
# Keep uploaded test bytes inside target/, never in the real ./data directory.
portplanner.file-store.local.path=target/test-file-store
# The module defaults in application.yml are deployment settings, so the tests pin
# the modules they expect to be on. Tests that need another module enable it themselves.
portplanner.modules.storage.enabled=true
portplanner.modules.member-portal.enabled=true
portplanner.modules.audit.enabled=true
